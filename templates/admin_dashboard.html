<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nhật Ký Hệ Thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e1e2f; color: #c8c8d2; font-family: monospace; }
        .log-container { background-color: #27293d; border-radius: 8px; padding: 20px; max-height: 75vh; overflow-y: auto; }
        .log-line { border-bottom: 1px solid #3b3d52; padding: 8px 0; font-size: 14px; }
        .log-info { color: #00d6b3; }
        .log-error { color: #fd5d93; }
        .log-warning { color: #ff8d72; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4 border-bottom border-secondary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-info">⚙️ AI Server Log Dashboard</span>
            <a href="/" class="btn btn-sm btn-outline-light">Quay lại Đăng nhập</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <h5 class="mb-3">Nhật ký hoạt động hệ thống (200 sự kiện gần nhất)</h5>
        <div class="log-container shadow-lg">
            {% if logs %}
                {% for log in logs %}
                    <!-- Phân loại màu sắc dựa trên keyword trong log -->
                    <div class="log-line 
                        {% if 'ERROR' in log or 'LỖI' in log %} log-error 
                        {% elif 'WARNING' in log %} log-warning 
                        {% else %} log-info {% endif %}">
                        {{ log }}
                    </div>
                {% endfor %}
            {% else %}
                <div class="text-muted">Hệ thống chưa có sự kiện nào được ghi nhận.</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
